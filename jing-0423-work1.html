<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慢日咖啡</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #f8f4eb;
      color: #34291f;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .page { max-width: 700px; margin: auto; padding: 40px 24px; }
    header { font-size: 22px; font-weight: bold; }
    .intro { padding: 64px 0 48px; }
    h1 {
      margin: 0 0 18px;
      font-size: clamp(32px, 6vw, 44px);
      line-height: 1.4;
    }
    p { color: #73685d; line-height: 1.8; }
    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 13px 24px;
      border-radius: 8px;
      background: #ad5d3f;
      color: white;
      text-decoration: none;
    }
    .button:hover { background: #924a31; }
    .button:focus-visible {
      outline: 3px solid #47764a;
      outline-offset: 4px;
    }
    .menu {
      padding: 24px;
      border: 1px solid #e6cdb7;
      border-radius: 12px;
      background: white;
    }
    h2 { margin: 0 0 12px; font-size: 22px; }
    .item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
    }
    .item + .item { border-top: 1px solid #eee7de; }
    .price { color: #ad5d3f; font-weight: bold; }
    footer { padding-top: 24px; color: #73685d; font-size: 13px; }

    @media (max-width: 480px) {
      .page { padding: 28px 20px; }
      .intro { padding-top: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>慢日咖啡</header>

    <main>
      <section class="intro">
        <h1>把日子放慢，<br>把咖啡喝好。</h1>
        <p>一杯现磨咖啡，一段属于自己的好时光。</p>
        <a class="button" href="#menu">查看菜单 →</a>
      </section>

      <section class="menu" id="menu" aria-labelledby="menu-title">
        <h2 id="menu-title">今日菜单</h2>

        <div class="item">
          <span>经典拿铁</span>
          <span class="price">¥28</span>
        </div>

        <div class="item">
          <span>浓缩美式</span>
          <span class="price">¥22</span>
        </div>

        <div class="item">
          <span>燕麦拿铁</span>
          <span class="price">¥32</span>
        </div>
      </section>
    </main>

    <footer>每天 08:00–20:00 · 欢迎来店坐坐</footer>
  </div>
</body>
</html>
